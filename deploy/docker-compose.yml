# The whole system: infrastructure, one container per sub-agent, and the
# orchestrator. All from one image, differing only in AGENT_KEY.
#
#   QWEN_API_KEY=... docker compose -f deploy/docker-compose.yml up --build
#
# Then:
#   curl localhost:8000/health                      the orchestrator
#   curl localhost:8001/health                      the catalog agent
#   curl -X POST localhost:8000/ask -H 'content-type: application/json' \
#        -d '{"question":"How many Arabic novels under 300 pages?","session_id":"s1"}'
#
# The service names matter. AGENT_URL_TEMPLATE resolves an agent to
# http://agent-<key>:8000/run, so a service named agent-catalog is reachable
# by registering an agent called catalog and nothing else - which is the
# point: registering an agent should not also mean editing this file.
#
# Infrastructure ports are the dev ones (55432 / 56379) so this and
# docker-compose.dev.yml describe the same database.

x-agent-base: &agent-base
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &agent-env
    PG_HOST: postgres
    PG_PORT: "5432"
    PG_DBNAME: library_dev
    # The authenticator, not an agent role and not the superuser. Each pool
    # runs SET ROLE to become its agent; see seeds/003_roles.sql.
    PG_USER: app_authenticator
    PG_PASSWORD: dev_authenticator
    REDIS_URL: redis://redis:6379/1
    AGENTS_REGISTRY_PATH: seeds/agents.example.json
    QWEN_API_KEY: ${QWEN_API_KEY:?set QWEN_API_KEY in your shell or a .env file}
    # DashScope keys are region-bound: a Beijing key on this endpoint returns
    # "401 Incorrect API key provided", which blames the key rather than the
    # region. Beijing is https://dashscope.aliyuncs.com/compatible-mode/v1
    # and is substantially cheaper for the same models.
    QWEN_API_URL: ${QWEN_API_URL:-https://dashscope-intl.aliyuncs.com/compatible-mode/v1}
    # qwen3-14b was the default here and answered "403 Unpurchased" on the
    # account this runs against, so a fresh checkout failed on its first
    # question. qwen-plus is verified to work there, with tool calling.
    # qwen-max and qwen3-max are the stronger steps up - one variable, then
    # `up -d --force-recreate`, and /health reports which one is running.
    QWEN_MODEL: ${QWEN_MODEL:-qwen-plus}
    # Qwen3 models return a chain of thought beside the answer, which
    # show_history.py renders as THINKS. Off by default: it requires a
    # streaming request, costs reasoning tokens on every call, and not every
    # model accepts the flag.
    QWEN_ENABLE_THINKING: ${QWEN_ENABLE_THINKING:-false}
    # qwen-max rejects anything above 8192 with a 400, so this is the value
    # the whole family accepts rather than the largest any one of them allows.
    QWEN_MAX_TOKENS: ${QWEN_MAX_TOKENS:-8192}
    QWEN_EMBED_MODEL: ${QWEN_EMBED_MODEL:-text-embedding-v3}
    # Unset means "same endpoint as chat". Set them to run embeddings
    # somewhere else - a second vLLM, or a local server - without touching
    # where generation happens.
    EMBED_API_URL: ${EMBED_API_URL:-}
    EMBED_API_KEY: ${EMBED_API_KEY:-}
    DIST_OP: ${DIST_OP:-<=>}
    # LOG_FORMAT=json for anything that ships logs somewhere that parses
    # them; text is for reading with `docker compose logs`.
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-text}
    HTTP_ERROR_DETAIL: ${HTTP_ERROR_DETAIL:-true}
    MAX_LOOP_ITERATIONS: ${MAX_LOOP_ITERATIONS:-12}
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: multi_agents_dev_db
    environment:
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: library_dev
    ports:
      - "55432:5432"
    volumes:
      - dev_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d library_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: multi_agents_dev_redis
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One per agent in the registry. Each verifies its own scope against the
  # GRANTs at startup and refuses to come up on a mismatch, so a container
  # that is running is a container whose registry entry and privileges agree.
  agent-catalog:
    <<: *agent-base
    container_name: multi_agents_agent_catalog
    environment:
      <<: *agent-env
      AGENT_KEY: catalog
    ports:
      # Bound to the loopback interface, unlike the orchestrator's 8000.
      # A sub-agent answers /run with no authentication - it trusts its
      # caller, because its caller is the orchestrator on the compose
      # network - so publishing it on every interface put the whole
      # delegation layer on the network for anyone who could reach the host.
      # Still reachable for `curl localhost:8001/health`, which is what the
      # published port was for.
      - "127.0.0.1:8001:8000"

  agent-circulation:
    <<: *agent-base
    container_name: multi_agents_agent_circulation
    environment:
      <<: *agent-env
      AGENT_KEY: circulation
    ports:
      - "127.0.0.1:8002:8000"

  # No AGENT_KEY, so this is the orchestrator. It holds one delegate tool per
  # registered sub-agent and no database access of its own beyond history.
  orchestrator:
    <<: *agent-base
    container_name: multi_agents_orchestrator
    environment:
      <<: *agent-env
      AGENT_KEY: ""
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      agent-catalog:
        condition: service_started
      agent-circulation:
        condition: service_started

volumes:
  dev_pgdata:
